<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (dailyMarketData(); as dailyMarketDataRef) {
      <div>
        <h2 data-cy="dailyMarketDataDetailsHeading"><span jhiTranslate="alertApp.dailyMarketData.detail.title">Daily Market Data</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ dailyMarketDataRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="alertApp.dailyMarketData.fetchDate">Fetch Date</span></dt>
          <dd>
            <span>{{ dailyMarketDataRef.fetchDate | formatMediumDate }}</span>
          </dd>
          <dt><span jhiTranslate="alertApp.dailyMarketData.symbol">Symbol</span></dt>
          <dd>
            <span>{{ dailyMarketDataRef.symbol }}</span>
          </dd>
          <dt><span jhiTranslate="alertApp.dailyMarketData.metricValue">Metric Value</span></dt>
          <dd>
            <span>{{ dailyMarketDataRef.metricValue }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button
          *jhiHasAnyAuthority="'ROLE_ADMIN'"
          type="button"
          [routerLink]="['/daily-market-data', dailyMarketDataRef.id, 'edit']"
          class="btn btn-primary"
        >
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
